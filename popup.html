<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 250px; padding: 15px; font-family: 'Segoe UI', sans-serif; }
    h1 { font-size: 18px; margin-top: 0; color: #333; display: flex; align-items: center; gap: 10px; }
    .lambda { color: #000000; font-size: 24px; font-weight: bold; }
    
    .btn {
      background-color: #000000; color: white; border: none;
      padding: 10px; border-radius: 6px; cursor: pointer; width: 100%;
      font-weight: 600; margin-top: 10px; transition: 0.2s;
    }
    .btn:hover { background-color: #000000; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }

    input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    
    #settings { margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; display: none; }
    .toggle-settings { font-size: 11px; color: #888; text-decoration: underline; cursor: pointer; margin-top: 10px; display: block; text-align: center;}
    
    #status { margin-top: 10px; font-size: 12px; color: #555; min-height: 15px; }
  </style>
</head>
<body>
  <h1><span class="lambda">&lambda;</span> LLMBDA</h1>
  
  <div id="main-view">
    <button id="optimizeBtn" class="btn">Optimize Tokens</button>
    <div id="status"></div>
  </div>

  <span class="toggle-settings" id="toggleSettings">Configure API Key</span>

  <div id="settings">
    <label style="font-size: 12px; font-weight: bold;">Groq API Key:</label>
    <input type="password" id="apiKeyInput" placeholder="gsk_...">
    <button id="saveKeyBtn" class="btn" style="background-color: #333;">Save Key</button>
    <p style="font-size: 10px; color: #666;">Get a free key at console.groq.com</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
